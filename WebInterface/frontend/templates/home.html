<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroScan — Water Safety Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --accent: #00ff88;
            --dark: #0a0a0f;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--dark);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.3);
            transform-origin: center center;
        }

        /* Dark Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(0, 10, 20, 0.45) 0%,
                rgba(0, 20, 40, 0.35) 50%,
                rgba(0, 10, 30, 0.5) 100%
            );
            z-index: -1;
        }

        /* Animated particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, rgba(0, 212, 255, 0.4), transparent),
                radial-gradient(2px 2px at 30% 60%, rgba(0, 255, 136, 0.3), transparent),
                radial-gradient(1px 1px at 50% 30%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(2px 2px at 70% 80%, rgba(0, 212, 255, 0.3), transparent),
                radial-gradient(1px 1px at 90% 40%, rgba(0, 255, 136, 0.4), transparent),
                radial-gradient(2px 2px at 20% 90%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(0, 212, 255, 0.5), transparent);
            background-size: 400px 400px;
            animation: particleDrift 60s linear infinite;
        }

        @keyframes particleDrift {
            from { background-position: 0 0; }
            to { background-position: 800px 800px; }
        }

        /* Main Content */
        .hero {
            position: relative;
            text-align: center;
            z-index: 1;
            padding: 40px;
            max-width: 900px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo / Icon */
        .hero-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 
                0 20px 60px rgba(0, 212, 255, 0.3),
                0 0 80px rgba(0, 212, 255, 0.2);
            animation: iconFloat 4s ease-in-out infinite, iconGlow 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 20px 60px rgba(0, 212, 255, 0.3), 0 0 80px rgba(0, 212, 255, 0.2); }
            50% { box-shadow: 0 25px 80px rgba(0, 212, 255, 0.5), 0 0 120px rgba(0, 212, 255, 0.3); }
        }

        /* Title */
        .hero-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(48px, 12vw, 120px);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 20px;
            background: linear-gradient(
                135deg,
                #ffffff 0%,
                var(--primary) 50%,
                var(--accent) 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleShimmer 4s ease-in-out infinite;
            text-shadow: 0 0 80px rgba(0, 212, 255, 0.5);
            letter-spacing: -2px;
        }

        @keyframes titleShimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        /* Subtitle */
        .hero-subtitle {
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin: 0 auto 50px;
            line-height: 1.6;
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* CTA Button */
        .cta-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 20px 50px;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #0a0a0f;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 10px 40px rgba(0, 212, 255, 0.4),
                0 0 0 0 rgba(0, 212, 255, 0);
            overflow: hidden;
            animation: fadeIn 1s ease-out 0.5s backwards;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.6s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 20px 60px rgba(0, 212, 255, 0.5),
                0 0 0 4px rgba(0, 212, 255, 0.2);
        }

        .cta-button:active {
            transform: translateY(0) scale(0.98);
        }

        .cta-button .arrow {
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover .arrow {
            transform: translateX(6px);
        }

        /* Secondary links */
        .secondary-links {
            margin-top: 30px;
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.7s backwards;
        }

        .secondary-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        .secondary-link:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
        }

        /* Version badge */
        .version-badge {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        /* Credits */
        .credits {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            backdrop-filter: blur(12px);
            text-align: center;
            line-height: 1.5;
        }

        .credits strong {
            color: var(--primary);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                padding: 30px 20px;
            }
            
            .hero-icon {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }

            .cta-button {
                padding: 16px 40px;
                font-size: 16px;
            }

            .secondary-links {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="/static/videos/FujiBG.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay"></div>
    <div class="particles"></div>

    <!-- Hero Content -->
    <div class="hero">
        <div class="hero-icon">💧</div>
        <h1 class="hero-title">HydroScan</h1>
        <p class="hero-subtitle">
            Water safety analysis powered by computer vision and AI. 
            Upload images or videos to detect potential water quality issues instantly.
        </p>
        <a href="/app" class="cta-button">
            Start Scanning
            <span class="arrow">→</span>
        </a>
        <div class="secondary-links">
            <a href="/model-lab" class="secondary-link">🔬 Model Lab</a>
        </div>
    </div>

    <div class="version-badge">HydroScan v1.0</div>
    <div class="credits">
        <strong>Made by</strong> Nicholas James, James Lili, Eithanniel, Russell, Almeria & Ralph
    </div>
</body>
</html>
