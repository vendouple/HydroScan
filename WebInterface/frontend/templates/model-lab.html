<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HydroScan - Model Lab</title>
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Model Lab specific styles */
      .model-lab-container {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 8px 24px 48px;
        display: grid;
        gap: 24px;
        position: relative;
        z-index: 1;
      }
      
      .model-selector {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      
      .model-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px 20px;
        color: var(--text);
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .model-btn:hover {
        background: rgba(0, 212, 255, 0.1);
        border-color: var(--primary);
      }
      
      .model-btn.active {
        background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 136, 0.15));
        border-color: var(--primary);
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
      }
      
      .test-results {
        display: grid;
        gap: 20px;
      }
      
      .result-section {
        display: grid;
        gap: 16px;
      }
      
      .result-image {
        width: 100%;
        max-width: 400px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      
      .metric-item {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
      }
      
      .metric-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      
      .metric-value {
        font-size: 1.4rem;
        font-weight: 600;
        background: linear-gradient(135deg, var(--primary), var(--accent-green));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .error-message {
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: 12px;
        padding: 16px;
        color: var(--error);
      }
      
      .nav-links {
        display: flex;
        gap: 16px;
        margin-top: 16px;
      }
      
      .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s ease;
      }
      
      .nav-links a:hover {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <!-- Particle Background -->
    <div class="particles-background"></div>
    
    <header class="hero premium">
      <h1>Model Lab</h1>
      <p class="subtitle">Test and evaluate different AI models for water quality analysis</p>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/app">Analysis App</a>
      </div>
    </header>

    <div class="model-lab-container">
      <div class="card premium">
        <div class="card-header">
          <h2>Select Model</h2>
          <p class="card-subtitle">Choose a model backend to test</p>
        </div>
        <div class="model-selector">
          <button class="model-btn active" data-model="rfdetr">RF-DETR</button>
          <button class="model-btn" data-model="inmodel">InModel (Custom)</button>
          <button class="model-btn" data-model="place365">Place365 (Scene)</button>
        </div>
      </div>

      <div class="card premium">
        <div class="card-header">
          <h2>Test Input</h2>
          <p class="card-subtitle">Upload an image to test the selected model</p>
        </div>
        <form id="test-form">
          <label class="field premium">
            <span class="label">Upload Test Image</span>
            <input type="file" name="file" accept="image/*" required />
          </label>
          <div class="actions">
            <button type="submit" class="btn-premium">Run Test</button>
          </div>
        </form>
      </div>

      <div class="test-results" id="results-container" style="display: none">
        <div class="result-section">
          <div class="card premium">
            <div class="card-header">
              <h3>Detection Results</h3>
            </div>
            <img class="result-image" id="detection-image" alt="Detection result" />
          </div>
        </div>
        <div class="result-section">
          <div class="card premium">
            <div class="card-header">
              <h3>Classification Results</h3>
            </div>
            <img class="result-image" id="classification-image" alt="Classification result" />
          </div>
        </div>
      </div>

      <div class="card premium" id="full-results-card" style="display: none">
        <div class="card-header">
          <h3>Full Analysis</h3>
        </div>
        <div class="metrics-grid" id="metrics-grid"></div>
        <div id="full-results-content"></div>
      </div>

      <div class="card premium" id="error-card" style="display: none">
        <div class="card-header">
          <h3>Error</h3>
        </div>
        <div class="error-message" id="error-message"></div>
      </div>
    </div>

    <script>
      // Model selection
      const modelBtns = document.querySelectorAll('.model-btn');
      let selectedModel = 'rfdetr';
      
      modelBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          modelBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedModel = btn.dataset.model;
        });
      });
      
      // Form submission
      const testForm = document.getElementById('test-form');
      const resultsContainer = document.getElementById('results-container');
      const fullResultsCard = document.getElementById('full-results-card');
      const errorCard = document.getElementById('error-card');
      
      testForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(testForm);
        formData.append('model', selectedModel);
        
        try {
          const response = await fetch('/api/model-test', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          
          if (result.error) {
            errorCard.style.display = 'block';
            document.getElementById('error-message').textContent = result.error;
            resultsContainer.style.display = 'none';
            fullResultsCard.style.display = 'none';
            return;
          }
          
          errorCard.style.display = 'none';
          resultsContainer.style.display = 'grid';
          fullResultsCard.style.display = 'block';
          
          // Update images
          if (result.detection_image) {
            document.getElementById('detection-image').src = result.detection_image;
          }
          if (result.classification_image) {
            document.getElementById('classification-image').src = result.classification_image;
          }
          
          // Update metrics
          const metricsGrid = document.getElementById('metrics-grid');
          metricsGrid.innerHTML = '';
          
          if (result.metrics) {
            for (const [key, value] of Object.entries(result.metrics)) {
              const metricItem = document.createElement('div');
              metricItem.className = 'metric-item';
              metricItem.innerHTML = `
                <div class="metric-label">${key.replace(/_/g, ' ')}</div>
                <div class="metric-value">${typeof value === 'number' ? value.toFixed(2) : value}</div>
              `;
              metricsGrid.appendChild(metricItem);
            }
          }
          
          // Update full results
          const fullResultsContent = document.getElementById('full-results-content');
          fullResultsContent.innerHTML = '<pre style="overflow-x: auto; font-size: 0.85rem;">' + 
            JSON.stringify(result, null, 2) + '</pre>';
          
        } catch (error) {
          errorCard.style.display = 'block';
          document.getElementById('error-message').textContent = 'Request failed: ' + error.message;
          resultsContainer.style.display = 'none';
          fullResultsCard.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
